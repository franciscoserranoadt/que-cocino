name: Construir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el proyecto Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.quecocino.app",
            "appName": "Qué cocino hoy",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Poner el icono del horno
        run: |
          mkdir -p assets
          cat > icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <defs>
              <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFD166"/>
                <stop offset="1" stop-color="#F0782A"/>
              </linearGradient>
              <linearGradient id="bread" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#E7A95C"/>
                <stop offset="1" stop-color="#B8702E"/>
              </linearGradient>
            </defs>
            <g transform="translate(512 526) scale(0.74) translate(-512 -526)">
            <!-- patas -->
            <rect x="282" y="770" width="60" height="34" rx="10" fill="#1E2A1B"/>
            <rect x="682" y="770" width="60" height="34" rx="10" fill="#1E2A1B"/>
            <!-- cuerpo -->
            <rect x="232" y="248" width="560" height="534" rx="60" fill="#FBF8F1"/>
            <!-- panel de mandos -->
            <path d="M292 248 H732 A60 60 0 0 1 792 308 V372 H232 V308 A60 60 0 0 1 292 248 Z" fill="#E6DFCF"/>
            <circle cx="318" cy="310" r="30" fill="#2D2D2D"/><rect x="314" y="284" width="8" height="26" rx="4" fill="#FBF8F1"/>
            <circle cx="412" cy="310" r="30" fill="#2D2D2D"/><rect x="408" y="284" width="8" height="26" rx="4" fill="#FBF8F1" transform="rotate(50 412 310)"/>
            <rect x="560" y="286" width="170" height="48" rx="12" fill="#1E2A1B"/>
            <circle cx="595" cy="310" r="9" fill="#F4D44A"/><circle cx="628" cy="310" r="9" fill="#F4D44A"/><circle cx="661" cy="310" r="9" fill="#F4D44A" opacity=".35"/><circle cx="694" cy="310" r="9" fill="#F4D44A" opacity=".35"/>
            <!-- tirador -->
            <rect x="316" y="398" width="392" height="24" rx="12" fill="#BDB4A1"/>
            <!-- puerta -->
            <rect x="276" y="436" width="472" height="306" rx="32" fill="#34312C"/>
            <!-- cristal -->
            <rect x="314" y="472" width="396" height="234" rx="20" fill="url(#glow)"/>
            <!-- bandeja -->
            <rect x="340" y="660" width="344" height="12" rx="6" fill="#8A4A1C" opacity=".55"/>
            <!-- pan -->
            <path d="M392 660 C392 560 452 528 512 528 C572 528 632 560 632 660 Z" fill="url(#bread)"/>
            <path d="M452 592 l30 -26 M500 584 l30 -26 M548 592 l30 -26" stroke="#8A4A1C" stroke-width="12" stroke-linecap="round" fill="none"/>
            <!-- brillo cristal -->
            <path d="M334 496 L394 496 L344 590 Z" fill="#FFFFFF" opacity=".28"/>
            </g>
          </svg>
          SVG
          npm install sharp@0.33
          node -e "require('sharp')('icon.svg').resize(1024,1024).png().toFile('assets/icon-only.png').then(()=>console.log('Icono creado'))"
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#2F6B34' --iconBackgroundColorDark '#2F6B34'

      - name: Dar permiso de cámara
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Compilar la APK
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../QueCocinoHoy.apk

      - name: Publicar la APK para descargarla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Qué cocino hoy v${{ github.run_number }}
          files: QueCocinoHoy.apk
