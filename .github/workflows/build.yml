name: Construir APK

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el proyecto Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 sharp@0.33 @capacitor-community/text-to-speech@6 @capacitor-community/keep-awake@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.quecocino.app",
            "appName": "Qué cocino hoy",
            "webDir": "www",
            "server": {
              "url": "https://franciscoserranoadt.github.io/que-cocino/",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: Poner el icono del horno
        run: |
          cat > icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <defs>
              <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFD166"/>
                <stop offset="1" stop-color="#F0782A"/>
              </linearGradient>
              <linearGradient id="bread" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#E7A95C"/>
                <stop offset="1" stop-color="#B8702E"/>
              </linearGradient>
            </defs>
            <g transform="translate(512 526) scale(0.74) translate(-512 -526)">
            <!-- patas -->
            <rect x="282" y="770" width="60" height="34" rx="10" fill="#1E2A1B"/>
            <rect x="682" y="770" width="60" height="34" rx="10" fill="#1E2A1B"/>
            <!-- cuerpo -->
            <rect x="232" y="248" width="560" height="534" rx="60" fill="#FBF8F1"/>
            <!-- panel de mandos -->
            <path d="M292 248 H732 A60 60 0 0 1 792 308 V372 H232 V308 A60 60 0 0 1 292 248 Z" fill="#E6DFCF"/>
            <circle cx="318" cy="310" r="30" fill="#2D2D2D"/><rect x="314" y="284" width="8" height="26" rx="4" fill="#FBF8F1"/>
            <circle cx="412" cy="310" r="30" fill="#2D2D2D"/><rect x="408" y="284" width="8" height="26" rx="4" fill="#FBF8F1" transform="rotate(50 412 310)"/>
            <rect x="560" y="286" width="170" height="48" rx="12" fill="#1E2A1B"/>
            <circle cx="595" cy="310" r="9" fill="#F4D44A"/><circle cx="628" cy="310" r="9" fill="#F4D44A"/><circle cx="661" cy="310" r="9" fill="#F4D44A" opacity=".35"/><circle cx="694" cy="310" r="9" fill="#F4D44A" opacity=".35"/>
            <!-- tirador -->
            <rect x="316" y="398" width="392" height="24" rx="12" fill="#BDB4A1"/>
            <!-- puerta -->
            <rect x="276" y="436" width="472" height="306" rx="32" fill="#34312C"/>
            <!-- cristal -->
            <rect x="314" y="472" width="396" height="234" rx="20" fill="url(#glow)"/>
            <!-- bandeja -->
            <rect x="340" y="660" width="344" height="12" rx="6" fill="#8A4A1C" opacity=".55"/>
            <!-- pan -->
            <path d="M392 660 C392 560 452 528 512 528 C572 528 632 560 632 660 Z" fill="url(#bread)"/>
            <path d="M452 592 l30 -26 M500 584 l30 -26 M548 592 l30 -26" stroke="#8A4A1C" stroke-width="12" stroke-linecap="round" fill="none"/>
            <!-- brillo cristal -->
            <path d="M334 496 L394 496 L344 590 Z" fill="#FFFFFF" opacity=".28"/>
            </g>
          </svg>
          SVG
          cat > icons.js <<'JS'
          const sharp = require('sharp');
          const fs = require('fs');
          const RES = 'android/app/src/main/res';
          const GREEN = '#2F6B34';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            const big = await sharp('icon.svg').resize(1024, 1024).png().toBuffer();
            const inner = await sharp(big).extract({ left: 171, top: 171, width: 682, height: 682 }).png().toBuffer();
            for (const [d, s] of Object.entries(sizes)) {
              const dir = RES + '/mipmap-' + d;
              fs.mkdirSync(dir, { recursive: true });
              const fg = Math.round(s * 108 / 48);
              await sharp(big).resize(fg, fg).png().toFile(dir + '/ic_launcher_foreground.png');
              const art = await sharp(inner).resize(s, s).png().toBuffer();
              const r = Math.round(s * 0.2);
              const square = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="' + s + '" height="' + s + '"><rect width="' + s + '" height="' + s + '" rx="' + r + '" fill="' + GREEN + '"/></svg>');
              const circle = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="' + s + '" height="' + s + '"><circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + s / 2 + '" fill="' + GREEN + '"/></svg>');
              await sharp(square).composite([{ input: art }]).png().toFile(dir + '/ic_launcher.png');
              await sharp(circle).composite([{ input: art }]).png().toFile(dir + '/ic_launcher_round.png');
              console.log('Icono ' + d + ' listo');
            }
            fs.mkdirSync(RES + '/values', { recursive: true });
            fs.mkdirSync(RES + '/mipmap-anydpi-v26', { recursive: true });
            const adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n';
            fs.writeFileSync(RES + '/mipmap-anydpi-v26/ic_launcher.xml', adaptive);
            fs.writeFileSync(RES + '/mipmap-anydpi-v26/ic_launcher_round.xml', adaptive);
            const bgFile = RES + '/values/ic_launcher_background.xml';
            fs.writeFileSync(bgFile, '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + GREEN + '</color>\n</resources>\n');
            console.log('Fondo verde listo');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node icons.js
          ls android/app/src/main/res/mipmap-anydpi-v26/ && cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Dar permiso de cámara
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

